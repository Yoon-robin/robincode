<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RobinCode</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="bar">
  <div class="brand"><span class="mark">ROBINCODE</span><span class="folder" id="folder" title=""></span></div>
  <div class="meters">
    <span class="meter warn" id="fake" hidden><span class="label">모델</span><span class="value">가짜(시험용)</span></span>
    <span class="meter" id="gpu"><span class="label">GPU</span><span class="value" id="gpu-value">확인 중</span><button type="button" class="ghost small" id="gpu-on" hidden title="GPU 켜기·끄기 도우미를 열어요. 빌릴지는 거기서 골라요.">켜기…</button></span>
    <span class="meter" id="credit" hidden><span class="label">크레딧</span><span class="value" id="credit-value"></span></span>
    <span class="meter ctx" id="ctx" title="자동으로 대화를 줄이는 지점까지"><span class="label">맥락</span><span class="track"><span class="fill" id="ctx-fill"></span></span><span class="value" id="ctx-value">0%</span></span>
  </div>
  <div class="actions">
    <button type="button" class="ghost" id="mode" title="명령 실행과 파일 수정 전에 묻기">묻고 실행</button>
    <button type="button" class="ghost" id="new">새 대화</button>
  </div>
</header>

<main id="log" aria-live="polite">
  <section class="empty" id="empty">
    <pre class="logo" aria-label="RobinCode"><span>█▀█ █▀█ █▀▄ ▀█▀ █▄ █ █▀▀ █▀█ █▀▄ █▀▀</span><span>█▀▄ █ █ █▀▄  █  █ ▀█ █   █ █ █ █ █▀ </span><span>▀ ▀ ▀▀▀ ▀▀  ▀▀▀ ▀  ▀ ▀▀▀ ▀▀▀ ▀▀  ▀▀▀</span></pre>
    <p class="sub">&gt; RobinAI GPU · <span id="model-name">Qwen3.8-27B</span></p>
    <p class="hint">이 폴더에서 파일을 읽고, 찾고, 고치고, PowerShell 명령을 실행해요.<br>명령 실행과 파일 수정은 실행하기 전에 물어봐요.</p>
  </section>
</main>

<footer class="composer">
  <div class="status" id="status" hidden></div>
  <form id="form" autocomplete="off">
    <span class="prompt" aria-hidden="true">&gt;</span>
    <textarea id="input" rows="1" placeholder="무엇을 할까요?" aria-label="메시지" spellcheck="false"></textarea>
    <button type="submit" class="primary" id="send">보내기</button>
  </form>
  <div class="keys"><span><kbd>Enter</kbd> 보내기</span><span><kbd>Shift</kbd>+<kbd>Enter</kbd> 줄 바꿈</span><span><kbd>Esc</kbd> 멈추기</span></div>
</footer>
</body>
</html>
